services:
  db:
    image: pgvector/pgvector:pg16
    container_name: reviewiq_db
    environment:
      POSTGRES_USER: reviewiq
      POSTGRES_PASSWORD: reviewiq
      POSTGRES_DB: reviewiq
    ports:
      - "127.0.0.1:5442:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U reviewiq"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  pgdata:
