server {
  listen 80;
  client_max_body_size 30m;
  root /usr/share/nginx/html;
  index index.html;

  location /api/ {
    proxy_pass http://api:8010/;
    proxy_http_version 1.1;
    proxy_buffering off;          # keeps the progress stream (SSE) live
    proxy_read_timeout 900s;
  }
  location / {
    try_files $uri /index.html;
  }
}
